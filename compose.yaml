x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    build:
      context: .
      target: caddy
    image: ${CADDY_IMAGE:-personal-finance-caddy:0.1.0}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: .
      target: production
    image: ${WEB_IMAGE:-personal-finance-web:0.1.0}
    restart: unless-stopped
    read_only: true
    environment: &django-environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?set APP_DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      IMPORT_TMP_DIR: /app/runtime/imports
      BUSINESS_BACKUP_DIR: /backups/business
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - django_secret_key
      - database_password
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/runtime/imports:size=128m,mode=0700,uid=10001,gid=10001
      - /app/runtime/restores:size=128m,mode=0700,uid=10001,gid=10001
    volumes:
      - ./backups/business:/backups/business
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  db:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backup:
    build:
      context: .
      target: maintenance
    image: ${MAINTENANCE_IMAGE:-personal-finance-maintenance:0.1.0}
    restart: unless-stopped
    read_only: true
    environment:
      <<: *django-environment
      BACKUP_MASTER_KEY_FILE: /run/secrets/backup_master_key
      DATABASE_BACKUP_DIR: /backups/database
      BUSINESS_BACKUP_DIR: /backups/business
      BACKUP_DAILY_TIME: ${BACKUP_DAILY_TIME:-02:30}
      BACKUP_WEEKLY_TIME: ${BACKUP_WEEKLY_TIME:-03:00}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - django_secret_key
      - database_password
      - backup_master_key
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /runtime:size=512m,mode=0700,uid=10001,gid=10001
    volumes:
      - ./backups/database:/backups/database
      - ./backups/business:/backups/business
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  database_password:
    file: ./secrets/database_password
  backup_master_key:
    file: ./secrets/backup_master_key
