[project]
name = "personal-finance"
version = "0.2.0"
description = "A single-user personal finance management system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "cryptography>=45,<47",
    "django>=5.2,<5.3",
    "gunicorn>=23,<24; sys_platform != 'win32'",
    "openpyxl>=3.1,<4",
    "fonttools[woff]>=4.63,<5",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "tinycss2>=1.5.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: tests spanning multiple application modules",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
