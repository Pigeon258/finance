{% extends "base.html" %}

{% block title %}{{ title }} · 个人财务{% endblock %}

{% block content %}
  <div class="page-heading" data-pf-part="page-header">
    <div>
      <h1>{{ title }}</h1>
      {% if operation_hint %}<p>{{ operation_hint }}</p>{% endif %}
    </div>
    {% if operation_label %}
      <strong class="operation-badge" data-pf-part="status-badge" data-status="{{ operation_tone }}" data-operation="{{ operation }}">{{ operation_label }}</strong>
    {% endif %}
  </div>
  <form method="post" data-pf-part="form-panel">
    {% csrf_token %}
    <input type="hidden" name="submission_token" value="{{ submission_token }}">
    {{ form.as_div }}
    <button type="submit">{{ submit_label|default:"保存" }}</button>
  </form>
{% endblock %}
