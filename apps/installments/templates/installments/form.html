{% extends "base.html" %}

{% block title %}{{ title }} · 个人财务{% endblock %}

{% block content %}
  <h1>{{ title }}</h1>
  {% if risk_placeholder %}
    <p>偿还能力风险预览将在任务 09 启用；风险结果不会阻止保存计划。</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="submission_token" value="{{ submission_token }}">
    {{ form.as_div }}
    <button type="submit">保存</button>
  </form>
{% endblock %}
