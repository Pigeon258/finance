{% load static %}
<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}个人财务{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <header>
      <nav aria-label="主导航">
        {% if request.user.is_authenticated %}
          <a href="{% url 'core:home' %}">首页</a>
          <a href="{% url 'ledger:transaction-index' %}">交易记录</a>
          <a href="{% url 'budgets:index' %}">预算管理</a>
          <a href="{% url 'credit:overview' %}">信用卡</a>
          <a href="{% url 'installments:index' %}">分期</a>
          <a href="{% url 'core:settings' %}">系统设置</a>
          <a href="{% url 'accounts:index' %}">账户</a>
          <a href="{% url 'ledger:category-index' %}">分类</a>
          <form class="inline-form" method="post" action="{% url 'core:logout' %}">
            {% csrf_token %}
            <button type="submit">退出登录</button>
          </form>
        {% endif %}
      </nav>
    </header>
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}<li>{{ message }}</li>{% endfor %}
      </ul>
    {% endif %}
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
