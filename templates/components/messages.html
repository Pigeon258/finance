{% if messages %}
  <div class="message-stack" data-pf-part="message-banner" aria-live="polite" aria-atomic="false">
    {% for message in messages %}
      <div class="app-message{% if message.tags %} message-{{ message.tags }}{% endif %}" role="status">
        <span class="message-icon" aria-hidden="true">{% if message.tags == "error" %}!{% elif message.tags == "warning" %}△{% else %}✓{% endif %}</span>
        <span>{{ message }}</span>
      </div>
    {% endfor %}
  </div>
{% endif %}
