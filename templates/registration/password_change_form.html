{% extends "base.html" %}

{% block title %}修改密码 · 个人财务{% endblock %}

{% block content %}
  <section data-pf-part="form-panel" aria-labelledby="password-heading">
    <h1 id="password-heading">修改密码</h1>
    <p>新密码至少 12 个字符。修改成功后，其他登录会话会失效。</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      <button type="submit">修改密码</button>
    </form>
  </section>
{% endblock %}
